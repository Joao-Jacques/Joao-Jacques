# Regenerates github-metrics.svg daily, including private repositories.
# Requires the METRICS_TOKEN secret: a personal access token with the "repo" and "read:user" scopes.
name: Metrics

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 BRT
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Joao-Jacques
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_isocalendar: yes
